spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/mydatabase}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
security.jwt.issuer=${AUTH_JWT_ISSUER:api-investimentos}
security.jwt.access-token-ttl=${AUTH_JWT_ACCESS_TOKEN_TTL:PT15M}
security.jwt.secret-base64=${AUTH_JWT_SECRET_BASE64}
security.refresh-token.ttl=${AUTH_REFRESH_TOKEN_TTL:P30D}
security.auth-rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
security.auth-rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:PT1M}

logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:INFO}
logging.level.org.springframework.orm.jpa=${SPRING_JPA_LOG_LEVEL:INFO}
