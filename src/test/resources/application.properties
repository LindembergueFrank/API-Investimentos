spring.datasource.url=jdbc:h2:mem:apiinvestimentos;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
security.jwt.issuer=api-investimentos-test
security.jwt.access-token-ttl=PT5M
security.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.refresh-token.ttl=P30D
security.refresh-token.cleanup.enabled=false
security.refresh-token.cleanup.interval=PT1H
security.refresh-token.cleanup.retention=P7D
security.refresh-token.cleanup.batch-size=100
security.auth-rate-limit.max-requests=100
security.auth-rate-limit.window=PT1M
